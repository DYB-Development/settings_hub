scope: settings — one settings page whose sections are registered by the app and by other gems

install:
  - gem "settings_hub"
  - mount SettingsHub::Engine
  - current_person
  - settings_account
  - can?
  - after_settings_change
  - SettingsHub.capabilities

develop:
  - bin/rails generate settings_hub:section
  - GET /settings/api/sections
  - PATCH /settings/api/sections/:key/:action_name
  - SettingsHub.section
  - SettingsHub.replace_section
  - SettingsHub.registry
  - SettingsHub::Result.ok
  - SettingsHub::Result.refused
  - SettingsHub::BadRegistration
  - section.key
  - section.area
  - section.title
  - section.renders
  - section.capability
  - section.runs
  - section.at
  - section.action
  - section.actions
  - section.named_actions?
  - person
  - account
  - selection
  - submit_url
  - submit_urls

sources:
  - lib/settings_hub.rb
  - lib/settings_hub/registry.rb
  - lib/settings_hub/section.rb
  - lib/settings_hub/result.rb
  - lib/settings_hub/bad_registration.rb
  - lib/settings_hub/settings_account.rb
  - lib/settings_hub/engine.rb
  - config/routes.rb
  - app/controllers/settings_hub/application_controller.rb
  - app/controllers/settings_hub/sections_controller.rb
  - app/controllers/settings_hub/api/sections_controller.rb
  - app/controllers/settings_hub/settings_controller.rb
  - app/views/settings_hub/settings/show.html.erb
  - app/views/settings_hub/sections/_profile.html.erb
  - app/models/settings_hub/change_name.rb
  - test/dummy/app/controllers/application_controller.rb
  - test/dummy/app/models/dummy_settings.rb
  - lib/generators/settings_hub/section/section_generator.rb
  - lib/settings_hub/reference/guide.md
